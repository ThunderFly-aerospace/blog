# This file is *NOT* reloaded automatically by `jekyll serve`.
# Restart the server after changing it.

remote_theme: "mmistakes/minimal-mistakes@4.28.1"

# Site settings
title: ThunderFly
masthead_title: Blog
description: The blog describes the story behind the scenes of ThunderFly company products.
url: "https://blog.thunderfly.cz" # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog
logo: /assets/images/tf-logo.png
locale: en-US

# Brand identity, consumed by assets/css/main.scss and _includes/head/custom.html.
# A blog of another brand (UST, MLAB) changes only this block and the settings above.
brand:
  font: 'Cabin, "Helvetica Neue", Arial, sans-serif'
  font_url: "https://fonts.googleapis.com/css2?family=Cabin:wght@400;600;700&display=swap"
  primary: "#fbba00"
  link: "#333"
  masthead_bg: "#000"
  masthead_link: "#fff"
  masthead_link_hover: "#fbba00"
  footer_bg: "#000"
  footer_text: "#fff"
  radius: "0"

# Default author, used for posts without `author:` and for the feed as a whole.
# Posts select a person with `author: <key from _data/authors.yml>`.
author:
  name: "ThunderFly"
  bio: "ThunderFly s.r.o. team"

# Google AdSense publisher ID. Remove the line to disable AdSense.
adsense_client: "ca-pub-9139027259917346"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ThunderFly-aerospace"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://www.facebook.com/ThunderFlyAerospace"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/thunderfly"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:info@thunderfly.cz"

permalink: /:year/:month/:day/:title/

# Build settings
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

# excerpt
excerpt_separator: "\n\n\n\n"

# paginate
paginate: 10

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /category/
tag_archive:
  type: liquid
  path: /tag/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      read_time: true
      share: false
      related: true

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
